## floatype の設定ファイルの例
##
## 置き場所: ~/.config/floatype/config.toml
## 書式: TOML。キーは src/protocol/config.proto の Config の項目名です。
##       選ぶ値（PILL など）は文字列で、色は 0xRRGGBB で書きます。
##
## - floatype の設定はすべてこのファイルにあります。書かない項目は既定値です。
## - 設定画面で変えると、このファイルの該当する行だけを書き換えます。
##   コメントと順番はそのまま残るので、dotfiles としてコード管理できます。
## - 手で書き換えると、保存して 1 秒ほど後の次のキーで反映されます。
## - 誤りがあると通知で行番号を知らせ、直前の正しい設定のまま動きます。
##   誤りを直すまで、設定画面の変更はこのファイルに書き込みません。
## - 表（[indicator_style] など）は、ほかの項目より後に置きます。
##   表の見出しより後に書いた項目は、その表の中の項目になります。
##
## 使うときは、行頭の「# 」を消してください。値は既定値です。


## ── floatype の項目 ──────────────────────────────

## zenz の補正のオン・オフ。オフにすると Mozc の変換だけになります。
# use_zenz = true

## zenz の答えを待つ上限（ミリ秒、50〜5000）。これより遅い答えは捨てます。
# zenz_timeout_millisec = 300

## 打っていない間は zenz を止める。1 分間使わないと止まり、次に打った 1 文字目で
## 起き直す（手を止めるまでに間に合う）。止まっている間は、zenz のメモリ
## （M4 Pro で約 30MB）を返す。
## false にすると floatype が動いている間ずっと動く。
# zenz_stop_when_idle = true

## アプリがカーソルの前の文を教えないとき（ターミナルなど）、同じ行で直前に確定した
## 文節（最大 4 つ）を、前の文の代わりに zenz に見せるか。続きの文では当たりやすく、
## 関係のない文を同じ行に続けて確定すると外れやすくなります。Enter や矢印を打った
## あとは、どちらでも見せません。
# zenz_context_from_commits = true

## zenz が直した確定を、予測候補（サジェスト）の履歴に覚えさせるか。
## 変換の順位は、これをオンにしても覚えません（下の zenz_teaches_mozc）。
# zenz_suggestion_learning = true

## zenz が直した語を、そのまま確定したら変換の順位にも覚えさせるか（true が
## Mozkey の既定に当たる）。true にすると、次から zenz を待たずにその語が出ます。
## 覚えた語は前後の文を見ずに出るので、zenz は履歴で 1 位になった語も直します
## （false のときは、履歴が押しのけた語には戻しません）。文節を切り直した補正は
## 覚えません。覚えた語を消すには、その語の上で control+delete を押します。
# zenz_teaches_mozc = false

## 確定したことのある補正を、次から zenz を待たずにすぐ出すのは、読みがこの
## 文字数以上のときだけ。1 でいつも。短い読み（きかい、かんじ）は文によって
## 書き分けたい語が多いので、Mozkey の既定は 7。短くても補正は覚えていて、
## zenz の答えが届けば出ます。
# zenz_remembered_min_chars = 1

## zenz の補正の表示中に Ctrl+Delete で止めた補正を覚え、同じ読みでは二度としない。
## 設定画面の「ユーザー履歴を消去」で忘れます。
# zenz_learning = true

## ライブ変換のオン・オフ。手が止まったら Space を押さなくても変換します。
# use_live_conversion = true

## ライブ変換を始めるまでの待ち時間（ミリ秒、0〜2000）。最後のキーから数えます。
# live_conversion_delay_millisec = 228

## ライブ変換を始める最小の文字数（1〜10）。
# live_conversion_min_chars = 2

## ライブ変換の後に zenz を始めるまでの待ち時間（ミリ秒、0〜5000）。最後のキーから数えます。
# zenz_delay_millisec = 500

## ライブ変換で、zenz の答えを最大どれだけ待ってから表示するか（ミリ秒、0〜1000）。
## 待つと、Mozc の変換が出てから zenz の変換に変わる、という 2 度の変化が 1 度になる。
## 0 は待たずに Mozc の変換を先に出す。待っている間に打ったキーは、打った文字のままの入力に効く。
# live_conversion_waits_for_zenz_millisec = 0

## 句読点の単打確定: オンのとき、ここに書いた文字を打つと、入力中の文を変換して
## zenz の答えを待ち（zenz_timeout_millisec まで）、そのまま確定する。待っている間に
## Enter を押すとその場で確定、ほかのキーは見えているものを確定してから効く。
## 文字の既定は Mozkey と同じ。設定画面では 。、？！（）「」・ から選べる。
# use_direct_commit = false
# direct_commit_characters = "、。？！「」"

## 日英混在入力: かなの入力中に英単語を打つと、変換で英字のままにする（update、
## ふぃぇをほぞんした と出る fileを保存した）。日本語として読める並びはそのまま。
## 英単語の一覧は english_words.txt で足したり外したりできる（-time と書くと外す）。
## インジケータの右端に、いまの語を日本語（あ）と英字（A）のどちらで扱っているかを出す。
# mixed_english = false

## 英字や数字のすぐ後の / を、中黒（・）ではなく / のまま打つ（2026/11/20、確定した英単語のすぐ後）。
## mixed_english がオンなら、打っている途中の英単語の後でも効く（before/after、test/spec、src/）。
## かなの後や、何も打っていないときの / は今までどおり記号の設定（既定は ・）に従う。z/ はいつも ・。
# slash_after_ascii = true

## 足した辞書（人名、地名、SudachiDict、ニコニコ大百科と pixiv 百科事典）の語も予測候補に出す
## （Mozkey と同じ）。オフなら、読みを最後まで打って変換したときだけ出る。
# suggest_added_words = false

## 予測候補の一覧と変換候補を、帯の左の丸の色で見分ける（予測候補の一覧は青、変換候補は灰色）。
# candidate_kind_mark = true

## 曖昧なローマ字の途中表示: 長い規則の途中のローマ字を、いまの時点の かな で見せる
## （n は ん、ローマ字テーブルに ms→ます と mst→ました があれば ms は ます）。
## 続けて長い規則が成り立てばそれに変わり、成り立たなければ見えていた かな のまま続く。
# display_ambiguous_romaji = false

## ライブ変換の上に読みを小さく出す（ルビ）。縦書きでは列の横に出す。
## 見た目は下の [ruby_style] で変えられます。
# live_conversion_ruby = false

## 未確定文字の近くに出す状態インジケータ（入力中 / Mozc / Zenz… / Zenz）。
## 見た目は下の [indicator_style] で変えられます。
# show_indicator = true


## ── Mozc の主な項目 ──────────────────────────────
## ほかの項目は src/protocol/config.proto を見てください。

## キー設定: KOTOERI（macOS の既定）、MSIME、ATOK、CUSTOM（custom_keymap_table を使う）
# session_keymap = "KOTOERI"

## ローマ字入力（ROMAN）か かな入力（KANA）か
# preedit_method = "ROMAN"

## 句読点: TOUTEN_KUTEN（、。）、COMMA_PERIOD（，．）、TOUTEN_PERIOD（、．）、COMMA_KUTEN（，。）
# punctuation_method = "TOUTEN_KUTEN"

## 記号: CORNER_BRACKET_MIDDLE_DOT（「」・）、SQUARE_BRACKET_SLASH（［］／）など
# symbol_method = "CORNER_BRACKET_MIDDLE_DOT"

## スペースの幅: FUNDAMENTAL_INPUT_MODE（入力モードに従う）、FUNDAMENTAL_FULL_WIDTH、FUNDAMENTAL_HALF_WIDTH
# space_character_form = "FUNDAMENTAL_INPUT_MODE"

## 候補の選択キー: SHORTCUT_123456789、SHORTCUT_ASDFGHJKL、NO_SHORTCUT
# selection_shortcut = "SHORTCUT_123456789"

## 学習: DEFAULT_HISTORY（する）、READ_ONLY（使うが覚えない）、NO_HISTORY（しない）
# history_learning_level = "DEFAULT_HISTORY"

## シークレットモード（学習しない）
# incognito_mode = false

## 予測候補: 入力履歴から、辞書から、変換結果から。表示する数（1〜9）
# use_history_suggest = true
# use_dictionary_suggest = true
# use_realtime_conversion = true
# suggestions_size = 3

## 変換の種類ごとのオン・オフ
# use_date_conversion = true
# use_single_kanji_conversion = true
# use_symbol_conversion = true
# use_number_conversion = true
# use_emoticon_conversion = true
# use_emoji_conversion = true
# use_calculator = true
# use_t13n_conversion = true
# use_zip_code_conversion = true
# use_spelling_correction = true

## Shift で英字を打ったとき: ASCII_INPUT_MODE（英数入力に切り替え）、KATAKANA_INPUT_MODE、OFF
# shift_key_mode_switch = "ASCII_INPUT_MODE"

## 句読点を打ったら自動で変換する
# use_auto_conversion = false

## テンキーの文字: NUMPAD_HALF_WIDTH、NUMPAD_FULL_WIDTH、NUMPAD_INPUT_MODE、NUMPAD_DIRECT_INPUT
# numpad_character_form = "NUMPAD_HALF_WIDTH"

## ¥ キーの文字: YEN_SIGN（¥）、BACKSLASH（\）
# yen_sign_character = "YEN_SIGN"


## ── 表（ほかの項目より後に置きます） ──────────────────────────────

## ルビの見た目。文字の大きさ（6〜72）、文字と背景の色（0xRRGGBB）、
## 角の丸み（0〜24）、不透明度（30〜100）。
# [ruby_style]
# font_size = 11
# text_color = 0x404040
# background_color = 0xffffff
# corner_radius = 4
# opacity_percent = 92

## 変換の候補の窓の見た目。
# [candidate_style]
##   配色: AUTO（システムのライトとダークに合わせる）、LIGHT、DARK、CUSTOM（下の色を使う）
# theme = "AUTO"
##   CUSTOM の色（0xRRGGBB）。書かない色は LIGHT の色（背景を暗い色にしたときは DARK の色）。値は LIGHT の色。
##   候補の文字、窓の背景、選んでいる行の背景（DARK でも同じ青）
# text_color = 0x17191e
# background_color = 0xffffff
# focused_background_color = 0xc4d0e1
##   選んでいる行の枠と窓の枠。書かなければ、選んでいる行は枠なし、窓は薄い線。値は例
# focused_border_color = 0x8a9bb5
# border_color = 0xd0d3d9
##   文字と行と余白の大きさ（既定の大きさに対する %、50〜300）
# size_percent = 100
##   角の丸み（0〜24）と不透明度（30〜100）
# corner_radius = 11
# opacity_percent = 100
##   影: SOFT（大きく淡い影）、NONE（なし）、STRONG（濃く大きい影）
# shadow = "SOFT"
##   書体のファミリー名（例 "Hiragino Sans"）。空かないものはシステムの書体
# font_family = ""

## 予測と サジェスト の候補の窓の見た目。項目は [candidate_style] と同じ。
# [suggest_style]
# theme = "AUTO"
# size_percent = 100

## インジケータの見た目。色は 0xRRGGBB です。
# [indicator_style]
##   形: PILL（角丸の帯）、ROUNDED_RECT（角丸の四角）、CIRCLE（丸）
# shape = "PILL"
##   文字: FULL_LABEL（入力中 など）、SYMBOL（あ / M / … / Z）、COLOR_ONLY（色だけ）
# label = "FULL_LABEL"
##   位置: ABOVE（未確定文字の上）、BELOW（下）、SIDE（左横）
# placement = "ABOVE"
# reading_color = 0x747d8c
# mozc_color = 0x586b85
# zenz_pending_color = 0x847438
# zenz_color = 0x338d85
# text_color = 0xffffff
##   幅（8〜400）と高さ（8〜200）。幅は文字に合わせて広がります。
# width = 56
# height = 22
##   文字の大きさ（6〜72）、角の丸み（0〜100）、不透明度（0〜100）
# font_size = 11
# corner_radius = 7
# opacity_percent = 93
##   未確定文字との間隔（0〜200）と、位置のずらし（-1000〜1000）
# gap = 5
# offset_x = 0
# offset_y = 0
